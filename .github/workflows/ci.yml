name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      sandbox:
        description: "Also run the slow sandbox suites (about 10 minutes)"
        type: boolean
        default: false

# Versions match the machine the README's numbers were measured on:
# Node 22.23.2, pnpm 10.28.2 (packageManager in package.json), Rust 1.96.1, cargo-near 0.23.0.

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # node:test and tsc --noEmit in every package.
      - run: make test-ts
      # Bundles, vectors, simulation, backtest. Its one network step (a NEAR Intents dry quote)
      # prints what happened and exits 0 when the service cannot be reached.
      - run: make judge

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.1
        with: { targets: wasm32-unknown-unknown, components: clippy }
      # cargo-near builds hidapi, which needs libudev on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts, cache-bin: true }
      - run: cargo install --locked cargo-near --version 0.23.0
      - run: make build-contracts
      # Unit, property, audit and vector tests, then clippy with warnings as errors.
      - run: make test-contracts

  sandbox:
    if: github.event_name == 'workflow_dispatch' && inputs.sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.2, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.96.1
        with: { targets: wasm32-unknown-unknown }
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: contracts, cache-bin: true }
      - run: cargo install --locked cargo-near --version 0.23.0
      # The contract's sandbox suite (it downloads near-sandbox 2.14.0 on first run), then the
      # integration e2e: the real wasm against the engine, call by call.
      - run: make test-sandbox
