[workspace]
resolver = "2"
members = ["weir", "mock-usdc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
near-sdk = "=5.30.1"

# NEAR charges for every wasm instruction and every byte of code, so favour size.
# Overflow checks stay on: a silent wrap in a balance is never acceptable.
[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# The property and vector tests run tens of thousands of simulated calls. Optimised
# dependencies make them several times faster; the contract's own code stays as built.
[profile.dev.package."*"]
opt-level = 2
